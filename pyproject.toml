[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yida-ai"
version = "0.2.5b0"
description = "Real-time multilingual knowledge-assisted reply system for Windows Live Captions"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Yida AI contributors"}]
keywords = ["live-captions", "translation", "knowledge-retrieval", "assistant"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["comtypes>=1.4.16; sys_platform == 'win32'", "tkinterdnd2>=0.6.3", "pypdf>=6.18.1"]

[project.optional-dependencies]
pdf = ["pypdf>=6.18.1"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "pyinstaller>=6.11",
  "pypdf>=6.18.1",
]

[project.scripts]
yida-ai = "yida_ai.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
