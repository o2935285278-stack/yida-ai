name: Unsigned release-candidate build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.15"
          cache: pip
      - name: Install hash-locked build dependencies
        run: python -m pip install --require-hashes -r requirements-build-win-py313.txt
      - name: Audit source and dependency licenses
        shell: powershell
        run: |
          scripts\check_sensitive.ps1
          python scripts\check_dependency_licenses.py
      - name: Fetch locked third-party build inputs
        shell: powershell
        run: |
          scripts\fetch_lct.ps1
          scripts\install_inno.ps1
      - name: Build unsigned installer
        shell: powershell
        run: |
          $lct = "build\third-party\LiveCaptions Translator.exe"
          $iscc = Join-Path $env:RUNNER_TEMP "inno-setup-6.7.3\ISCC.exe"
          scripts\build_installer.ps1 -LctExecutable $lct -InnoCompiler $iscc -Python python
      - name: Generate SBOM and checksums
        shell: powershell
        run: |
          python scripts\generate_sbom.py --output dist\installer\YidaAI-0.2.2-beta.sbom.cdx.json
          $files = Get-ChildItem dist\installer -File | Sort-Object Name
          $lines = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          $lines | Set-Content dist\installer\SHA256SUMS.txt -Encoding ascii
      - name: Microsoft Defender scan
        shell: powershell
        run: |
          $targets = @(
            "dist\YidaAI\YidaAI.exe",
            "dist\installer\YidaAI-0.2.2-beta-win-x64-setup.exe"
          )
          scripts\scan_release.ps1 -RequireAvailable -Path $targets
      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yida-ai-unsigned-${{ github.sha }}
          path: |
            dist/installer/YidaAI-0.2.2-beta-win-x64-setup.exe
            dist/installer/YidaAI-0.2.2-beta.sbom.cdx.json
            dist/installer/SHA256SUMS.txt
            dist/verification/*.json
          if-no-files-found: error
          retention-days: 14
