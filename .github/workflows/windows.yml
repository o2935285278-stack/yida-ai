name: Windows test and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - name: Build and smoke packaged app
        if: matrix.python-version == '3.13'
        shell: powershell
        run: scripts\build_windows.ps1 -Python python
      - name: Sensitive data scan
        if: matrix.python-version == '3.13'
        shell: powershell
        run: scripts\check_sensitive.ps1
      - name: Dependency license allowlist
        if: matrix.python-version == '3.13'
        run: python scripts\check_dependency_licenses.py
